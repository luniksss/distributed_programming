version: '3.8'

services:
  app1:
    build: Valuator
    container_name: valuator-app1
    ports:
      - "8081:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - REDIS_CONNECTION=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - valuator-network
    restart: unless-stopped

  app2:
    build: Valuator
    container_name: valuator-app2
    ports:
      - "8082:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - REDIS_CONNECTION=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - valuator-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: valuator-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app1
      - app2
    networks:
      - valuator-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:latest
    container_name: valuator-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - valuator-network

networks:
  valuator-network:
    driver: bridge